# helm companion relay, for self-hosting.
#
#   cd web-companion
#   echo "HELM_RELAY_SECRET=$(openssl rand -hex 32)" > .env
#   docker compose up --build -d
#
# then put a TLS reverse proxy in front of 127.0.0.1:8788 (see README.md). The port is published on this computer only.
name: helm-companion-relay

services:
  relay:
    build:
      # Built from the repository root: the page is the desktop renderer, so it needs src/ and hosted/ as well.
      context: ..
      dockerfile: web-companion/Dockerfile
    image: helm-companion-relay
    ports:
      - "127.0.0.1:8788:8788"
    env_file:
      - .env
    volumes:
      # Push subscriptions only. Losing it means phones have to allow notifications again; pairings live in cookies and the desktop.
      - relay-data:/home/helm
    restart: unless-stopped

volumes:
  relay-data:
