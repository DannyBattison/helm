# Builds the hosted server's Docker image (ghcr.io/<owner>/helm-hosted, owner lower-cased) and pushes it by digest only, with no tags.
# The digests are uploaded as workflow artifacts (digest-slim, digest-full); whoever calls this decides what to tag them as.
#
#   release workflow  -> calls this, then tags the digests :0.2.0, :0.2 and :latest (and the -full ones) once the release exists
#   run it by hand    -> from the Actions tab, to publish whatever branch you pick (tagged with the branch name)
#
# Two variants are built: the slim image and the full one, with LibreOffice, ffmpeg, pandoc, OCR and Playwright/Chromium,
# whose tags end in -full (:latest-full, :0.2.0-full ...).
#
# It needs no secrets: the workflow's own token may push to the package of the repository it runs in. The first published image is private;
# make it public (or give your server a token that can read packages) under the package's settings on GitHub.
# Pulling it on the server: docker pull ghcr.io/<owner>/helm-hosted:latest
name: hosted-image
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build for
        default: linux/amd64
        type: choice
        options: [linux/amd64, 'linux/amd64,linux/arm64']
permissions:
  contents: read
  packages: write
concurrency:
  group: hosted-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: slim, include: 'CORE|SEARCH|NETWORK|EDITING|BROWSING' }
          - { name: full, include: ALL }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/helm-hosted" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hosted/Dockerfile
          build-args: INCLUDE=${{ matrix.include }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          labels: |
            org.opencontainers.image.title=helm hosted
            org.opencontainers.image.description=helm in a browser: one user, one Claude login
          outputs: type=image,name=${{ steps.repo.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}
      - run: echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}
          retention-days: 1
  # By hand only (a caller always passes ref): name the digests after the branch that was built.
  tag:
    if: inputs.ref == ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/helm-hosted
          branch=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          docker buildx imagetools create -t "$image:$branch" "$image@$(cat digest-slim)"
          docker buildx imagetools create -t "$image:$branch-full" "$image@$(cat digest-full)"
