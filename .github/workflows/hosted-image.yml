# Builds the hosted server's Docker image and publishes it to the GitHub Container Registry, as ghcr.io/<owner>/helm-hosted
# (the owner is lower-cased for you).
#
#   release workflow  -> :0.2.0, :0.2 and :latest (called by release.yml once the tag exists; :latest is always the newest release)
#   push to main      -> :main and :sha-<commit> (unreleased, never :latest)
#   run it by hand    -> from the Actions tab, to publish whatever branch you pick (tagged with the branch name)
#
# Two variants are built: the slim image (the tags above) and the full one, with LibreOffice, ffmpeg, pandoc, OCR and Playwright/Chromium,
# whose tags end in -full (:latest-full, :0.2.0-full ...).
#
# It needs no secrets: the workflow's own token may push to the package of the repository it runs in. The first published image is private;
# make it public (or give your server a token that can read packages) under the package's settings on GitHub.
# Pulling it on the server: docker pull ghcr.io/<owner>/helm-hosted:latest
name: hosted-image
on:
  push:
    branches: [main]
    paths: ['hosted/**', 'src/**', 'package.json', 'package-lock.json', 'tsconfig*.json', 'desktop/tsconfig.json', '.github/workflows/hosted-image.yml']
  workflow_call:
    inputs:
      version:
        description: Release version (without the v) to build from its tag and publish as latest
        type: string
        required: true
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build for
        default: linux/amd64
        type: choice
        options: [linux/amd64, 'linux/amd64,linux/arm64']
permissions:
  contents: read
  packages: write
concurrency:
  group: hosted-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - include: CORE|SEARCH|NETWORK|EDITING|BROWSING
            suffix: ''
          - include: ALL
            suffix: -full
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          images: ghcr.io/${{ github.repository_owner }}/helm-hosted
          tags: |
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=helm hosted
            org.opencontainers.image.description=helm in a browser: one user, one Claude login
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hosted/Dockerfile
          build-args: INCLUDE=${{ matrix.include }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=image${{ matrix.suffix }}
