# Manual release: run the workflow from the Actions tab and choose a major, minor or patch bump. The version is worked out
# from the latest v* tag (the first release is 0.1.0). The desktop installers (desktop.yml) and the hosted Docker images
# (hosted-image.yml) are built in parallel with the tests and typecheck (ci.yml) and only provide artifacts. When all have succeeded, the publish job tags the
# commit, creates the GitHub release (which is what the app's auto-update reads) with the installers attached, and tags
# the images :X.Y.Z, :X.Y and :latest. A failed build leaves no tag, release or image tag behind.
# The README's release badges read from the release. Installers are unsigned.
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [minor, major, patch]
        default: minor
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            version=0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "${{ inputs.bump }}" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  tests:
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
  image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hosted-image.yml
    with:
      ref: ${{ github.sha }}
  publish:
    needs: [version, tests, desktop, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the release
        run: |
          gh release create "v$VERSION" installers/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes --latest
      - name: Tag the images
        run: |
          set -euo pipefail
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/helm-hosted
          minor=${VERSION%.*}
          for variant in slim full; do
            suffix=$([ "$variant" = full ] && echo -full || echo)
            docker buildx imagetools create \
              -t "$image:$VERSION$suffix" -t "$image:$minor$suffix" -t "$image:latest$suffix" \
              "$image@$(cat digest-$variant)"
          done
