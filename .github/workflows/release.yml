# Manual release: run the workflow from the Actions tab and choose a major, minor or patch bump. The version is worked out
# from the latest v* tag (the first release is 0.1.0). The desktop installers (desktop.yml) and the hosted Docker images
# (hosted.yml) are built in parallel with the tests and typecheck (ci.yml) and only provide artifacts. When all have succeeded, the publish job tags the
# commit, creates the GitHub release (which is what the app's auto-update reads) with the installers attached, and tags
# the images :X.Y.Z, :X.Y and :latest. A failed build leaves no tag, release or image tag behind.
# The README's release badges read from the release. Installers are unsigned.
# Tick what to build: desktop installers, the hosted images and the Android and iOS phone apps (mobile.yml; the APK and IPA are attached to the
# release too). A release without the desktop installers is not marked "latest", so the desktop app's auto-update does not look at it.
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [minor, major, patch]
        default: minor
      desktop:
        description: Desktop installers (macOS, Windows, Linux)
        type: boolean
        default: true
      hosted:
        description: Hosted Docker images
        type: boolean
        default: true
      android:
        description: Android app (APK)
        type: boolean
        default: false
      ios:
        description: iOS app (IPA, unsigned unless the IOS_* secrets are set)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            version=0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "${{ inputs.bump }}" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  tests:
    uses: ./.github/workflows/ci.yml
  desktop:
    if: inputs.desktop
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
  hosted:
    if: inputs.hosted
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hosted.yml
    with:
      ref: ${{ github.sha }}
  mobile:
    if: inputs.android || inputs.ios
    needs: version
    uses: ./.github/workflows/mobile.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      android: ${{ inputs.android }}
      ios: ${{ inputs.ios }}
  publish:
    # Builds that were not ticked are skipped, which is fine; one that failed or was cancelled stops the release.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [version, tests, desktop, hosted, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - if: inputs.desktop
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - if: inputs.android || inputs.ios
        uses: actions/download-artifact@v5
        with:
          pattern: mobile-*
          path: mobile
          merge-multiple: true
      - if: inputs.hosted
        uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          merge-multiple: true
      - if: inputs.hosted
        uses: docker/setup-buildx-action@v3
      - if: inputs.hosted
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the release
        run: |
          shopt -s nullglob
          files=(installers/* mobile/*)
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" --generate-notes --latest="${{ inputs.desktop }}"
      - name: Tag the images
        if: inputs.hosted
        run: |
          set -euo pipefail
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/helm-hosted
          minor=${VERSION%.*}
          for variant in slim full; do
            suffix=$([ "$variant" = full ] && echo -full || echo)
            docker buildx imagetools create \
              -t "$image:$VERSION$suffix" -t "$image:$minor$suffix" -t "$image:latest$suffix" \
              "$image@$(cat digest-$variant)"
          done
