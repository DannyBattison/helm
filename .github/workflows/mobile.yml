# Builds the phone app (mobile-app/) for Android and/or iOS and uploads the files as workflow artifacts (mobile-android, mobile-ios). Nothing
# is published: release.yml calls this and attaches the files to the release. Run it by hand from the Actions tab (tick the platforms) to get
# builds of any branch.
#
# Android: an installable APK. Signed with your keystore if the ANDROID_* secrets below are set; otherwise with a throwaway key made for the
# run, which installs fine but cannot update an app installed from an earlier run (the key differs), so uninstall first.
# iOS: an .ipa. Without the IOS_* secrets it is UNSIGNED: install it with a sideloading tool (Sideloadly, AltStore), which signs it with your
# own Apple ID. With them, it is signed here with your certificate and provisioning profile and can be installed on the devices in that profile.
# Uploading to TestFlight / the App Store is not done here.
#
# Secrets (all optional; the release workflow passes them on), under Settings -> Secrets and variables -> Actions:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64   (the certificate must be the one in the profile)
#
# Not yet run: written without access to GitHub Actions, an Android SDK or Xcode. Expect to fix a step or two the first time.
name: mobile
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        default: ''
      version:
        description: Version name to stamp into the app
        type: string
        default: ''
      android:
        description: Build the Android app
        type: boolean
        default: true
      ios:
        description: Build the iOS app
        type: boolean
        default: true
      bundle_id:
        description: iOS bundle identifier
        type: string
        default: app.helm.mobile
  workflow_dispatch:
    inputs:
      version:
        description: Version name, for example 0.2.0 (default 0.1.<run number>)
        type: string
        default: ''
      android:
        description: Build the Android app
        type: boolean
        default: true
      ios:
        description: Build the iOS app
        type: boolean
        default: true
      bundle_id:
        description: iOS bundle identifier, if your signing profile or Apple ID needs a different one
        type: string
        default: app.helm.mobile
permissions:
  contents: read
env:
  VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
jobs:
  android:
    if: inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix hosted ci
      - run: npm --prefix mobile-app ci
      - name: Build the web app and sync it into the Android project
        run: npm --prefix mobile-app run sync
      - name: Build the release APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease -PhelmVersionCode=${{ github.run_number }} -PhelmVersionName=${{ env.VERSION }}
      - name: Align and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=mobile-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="helm-android-$VERSION.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" --out "$OUT" aligned.apk
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key made for this run."
            keytool -genkeypair -keystore throwaway.keystore -storepass helm-throwaway -keypass helm-throwaway -alias helm -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=helm, O=helm"
            "$BT/apksigner" sign --ks throwaway.keystore --ks-pass pass:helm-throwaway --key-pass pass:helm-throwaway --out "$OUT" aligned.apk
          fi
          "$BT/apksigner" verify --print-certs "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: helm-android-*.apk
          retention-days: 3

  ios:
    if: inputs.ios
    runs-on: macos-15
    env:
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      BUNDLE_ID: ${{ inputs.bundle_id || 'app.helm.mobile' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix hosted ci
      - run: npm --prefix mobile-app ci
      - name: Build the web app and sync it into the iOS project (installs the pods)
        run: npm --prefix mobile-app run sync
      - name: Archive, unsigned
        working-directory: mobile-app/ios/App
        run: |
          set -euo pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 40
      - name: Package the .ipa
        run: |
          set -euo pipefail
          mkdir -p ipa/Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" ipa/Payload/
      - name: Sign with your certificate and profile
        if: env.IOS_CERT_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Signing as: $IDENTITY"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > entitlements.plist
          APP=ipa/Payload/App.app
          cp profile.mobileprovision "$APP/embedded.mobileprovision"
          # Frameworks first, then the app that contains them.
          for f in "$APP"/Frameworks/*; do [ -e "$f" ] && codesign --force --sign "$IDENTITY" --timestamp=none "$f"; done
          codesign --force --sign "$IDENTITY" --entitlements entitlements.plist --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"
          echo "SIGNED=signed" >> "$GITHUB_ENV"
      - name: Zip
        run: |
          set -euo pipefail
          SUFFIX=${SIGNED:-unsigned}
          (cd ipa && zip -qry "../helm-ios-$VERSION-$SUFFIX.ipa" Payload)
          ls -l helm-ios-*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: helm-ios-*.ipa
          retention-days: 3
